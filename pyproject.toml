[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "gherila"
version = "1.4.0"
authors = [{name = "s4nica"}]
description = "Async platform clients with an optional language-neutral HTTP API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["aiohttp>=3.10,<4", "munch>=4,<5", "pydantic>=2.7,<3", "aiofiles>=23.2,<26"]
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Framework :: AsyncIO",
]

[project.optional-dependencies]
fast = ["orjson>=3.10,<4", "selectolax>=0.3.21,<1"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1", "build>=1,<2", "ruff>=0.11,<1"]

[project.scripts]
gherila-api = "gherila.api:main"

[project.urls]
Repository = "https://github.com/br4nch/gherila"
Issues = "https://github.com/br4nch/gherila/issues"

[tool.setuptools.packages.find]
include = ["gherila*"]

[tool.setuptools.package-data]
gherila = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
